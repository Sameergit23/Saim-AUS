# Render Blueprint — provisions Saim-AUS + a managed PostgreSQL in one step.
# https://render.com/docs/blueprint-spec
#
# It builds the Docker image, runs database migrations, then starts the service.
# JWT_SECRET and MFA_SECRET_KEY are generated automatically. PUBLIC_BASE_URL is
# auto-detected from Render's external URL. To enable real emails, add the SMTP_*
# variables in the dashboard after the first deploy (see docs/guides/Deployment.md).

databases:
  - name: saim-aus-db
    plan: free
    databaseName: saim_aus
    user: saim_aus

services:
  - type: web
    name: saim-aus
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: saim-aus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MFA_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
